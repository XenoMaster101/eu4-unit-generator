[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eu4unitgen"
version = "1.0.4"
description = "Generates Europa Universalis IV land-unit sets for a nation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0" }
dependencies = ["PySide6", "Jinja2", "Pillow>=11.2.1"]

[project.gui-scripts]
eu4unitgen-gui = "eu4unitgen.gui.app:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"eu4unitgen.library" = ["base_models.json", "bodies.json", "additions.json", "materials.json", "templates.json", "vocabulary.json",
                        "starter/*/*", "starter/*/*/*", "starter/*/*/*/*"]
"eu4unitgen.pdxscript" = ["templates/*.j2"]
"eu4unitgen.blender" = ["jobs/*.py"]
"eu4unitgen.ref3d" = ["templates/*.json"]
"eu4unitgen.ai" = ["jobs/*.py"]
"eu4unitgen.setup_scripts" = ["*.sh"]
"eu4unitgen.gui" = ["icon.png", "eu4unitgen.ico"]
"eu4unitgen.core" = ["example_pictures/*.png", "example_pictures/RIGHTS.txt"]
"eu4unitgen" = ["release.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["vanilla: needs EU4_PATH set to a real EU4 install; skipped otherwise"]
